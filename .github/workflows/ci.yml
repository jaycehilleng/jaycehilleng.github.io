name: CI Security Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest

    - name: Run MCP Proxy Security Unit Tests
      env:
        PYTHONPATH: src/mcp_proxy
      run: |
        python -m pytest src/mcp_proxy/test_proxy.py -v

    - name: Run NHI Token Validator Unit Tests
      env:
        PYTHONPATH: src/identity
      run: |
        python -m pytest src/identity/test_token_validator.py -v