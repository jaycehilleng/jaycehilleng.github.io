name: Work item
description: A scoped change with testable acceptance criteria.
title: "<verb> <outcome>"
assignees:
  - jaycehilleng
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is missing, wrong, or at risk today, and why it matters.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Checkable outcomes. The work is done when every box can be ticked with evidence.
      value: |
        - [ ]
        - [ ]
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Out of scope
      description: What this item deliberately does not cover.
    validations:
      required: false
